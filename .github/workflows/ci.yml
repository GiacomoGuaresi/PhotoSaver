name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libpulse0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest

  exfat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: exFAT support
        run: |
          sudo apt-get update
          sudo apt-get install -y exfatprogs "linux-modules-extra-$(uname -r)" \
            libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libpulse0
          sudo modprobe exfat
      - name: Mount two exFAT test disks
        run: |
          for n in 1 2; do
            truncate -s 128M "$RUNNER_TEMP/disk$n.img"
            mkfs.exfat -L "PSTEST$n" "$RUNNER_TEMP/disk$n.img"
            sudo mkdir -p "/mnt/pstest$n"
            sudo mount -o "loop,uid=$(id -u),gid=$(id -g)" "$RUNNER_TEMP/disk$n.img" "/mnt/pstest$n"
          done
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest tests/test_exfat.py -v
        env:
          PHOTOSAVER_EXFAT: /mnt/pstest1:/mnt/pstest2
          QT_QPA_PLATFORM: offscreen
