[project]
name = "photosaver"
dynamic = ["version"]
description = "Keep a photo archive mirrored on two external drives: verified uploads, bit rot checks, change tracking."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Giacomo Guaresi" }]
requires-python = ">=3.11"
dependencies = [
    "pillow>=11",
    "pyside6>=6.7",
]

[project.gui-scripts]
photosaver = "photosaver.ui.app:main"

[project.urls]
Repository = "https://github.com/GiacomoGuaresi/PhotoSaver"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/photosaver/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/photosaver"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
